# Pipeline de Integração Contínua do TaskFlow.
# Executa a cada push e pull request na branch main:
#   1) análise estática de qualidade de código com flake8
#   2) testes automatizados com pytest
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar qualidade do código (flake8)
        run: flake8 src tests

      - name: Executar testes automatizados (pytest)
        run: pytest -v
